<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CPU Floyd-Steinberg Error Diffusion</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<script>
let source;
let dithered;

function setup() {
  createCanvas(720, 480);
  pixelDensity(1);
  noSmooth();
  source = createGraphics(width, height);
  dithered = createImage(width, height);
  noLoop();
  redrawDither();
}

function mousePressed() {
  redrawDither();
}

function redrawDither() {
  source.pixelDensity(1);
  source.background(240);
  source.noStroke();
  source.colorMode(HSB, 360, 100, 100, 100);
  source.background(random(360), 55, 95);
  for (let i = 0; i < 28; i++) {
    source.fill((random(360) + frameCount * 3) % 360, random(60, 100), random(40, 100), 70);
    source.circle(random(width), random(height), random(60, 240));
  }

  source.loadPixels();
  let gray = new Array(width * height);
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      let idx = 4 * (y * width + x);
      let r = source.pixels[idx];
      let g = source.pixels[idx + 1];
      let b = source.pixels[idx + 2];
      gray[y * width + x] = 0.299 * r + 0.587 * g + 0.114 * b;
    }
  }

  dithered.loadPixels();
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      let i = y * width + x;
      let oldPixel = gray[i];
      let newPixel = oldPixel < 128 ? 0 : 255;
      let error = oldPixel - newPixel;
      gray[i] = newPixel;

      if (x + 1 < width) gray[i + 1] += error * 7 / 16;
      if (x - 1 >= 0 && y + 1 < height) gray[i + width - 1] += error * 3 / 16;
      if (y + 1 < height) gray[i + width] += error * 5 / 16;
      if (x + 1 < width && y + 1 < height) gray[i + width + 1] += error * 1 / 16;

      let idx = 4 * i;
      dithered.pixels[idx] = newPixel;
      dithered.pixels[idx + 1] = newPixel;
      dithered.pixels[idx + 2] = newPixel;
      dithered.pixels[idx + 3] = 255;
    }
  }
  dithered.updatePixels();

  background(0);
  image(dithered, 0, 0);
  fill(255, 0, 140);
  noStroke();
  text('Floyd-Steinberg CPU dither | click to regenerate', 12, 22);
}
</script>
</body>
</html>
